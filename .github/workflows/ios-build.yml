name: Gerar IPA iOS sem Conta Paga Apple

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-unsigned-ipa:
    name: Compilar IPA (Xcode macOS)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Pré-construir projeto nativo iOS (expo prebuild)
        run: npx expo prebuild --platform ios

      - name: Compilar App nativo ARM64 para Dispositivo Fisico
        run: |
          cd ios
          xcodebuild -workspace meuappios.xcworkspace \
                     -scheme meuappios \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath ../build/meuappios.xcarchive \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     archive

      - name: Empacotar estrutura Payload e gerar .IPA
        run: |
          mkdir -p Payload
          cp -r build/meuappios.xcarchive/Products/Applications/*.app Payload/
          zip -r meu-app-nubank.ipa Payload
          mkdir -p artifacts
          mv meu-app-nubank.ipa artifacts/

      - name: Disponibilizar IPA para Download no GitHub
        uses: actions/upload-artifact@v4
        with:
          name: meu-app-nubank-ipa
          path: artifacts/meu-app-nubank.ipa
