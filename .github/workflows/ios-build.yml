name: Gerar IPA iOS sem Conta Paga Apple

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-unsigned-ipa:
    name: Compilar IPA (Xcode macOS)
    runs-on: macos-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🛠️ Pre-construir projeto nativo iOS (expo prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: ☕ CocoaPods Install
        working-directory: ./ios
        run: pod install

      - name: 🔨 Compilar e Arquivar (Unsigned - Sem Apple ID)
        run: |
          WORKSPACE_NAME=$(ls ios | grep .xcworkspace | head -n 1)
          SCHEME_NAME=$(basename "$WORKSPACE_NAME" .xcworkspace)
          echo "Workspace: $WORKSPACE_NAME"
          echo "Scheme: $SCHEME_NAME"
          mkdir -p build

          xcodebuild clean archive \
            -workspace "ios/$WORKSPACE_NAME" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/$SCHEME_NAME.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: 📦 Empacotar estrutura Payload e gerar .IPA
        run: |
          mkdir -p build-output/Payload

          # Procura o .app no build gerado
          APP_PATH=$(find build -name "*.app" 2>/dev/null | head -n 1)

          # Se nao achou no build local, busca no arquivo default do Xcode
          if [ -z "$APP_PATH" ]; then
            echo "Buscando nos arquivos do Xcode..."
            APP_PATH=$(find ~/Library/Developer/Xcode/Archives -name "*.app" 2>/dev/null | head -n 1)
          fi

          # Fallback geral
          if [ -z "$APP_PATH" ]; then
            echo "Buscando em todo o workspace..."
            APP_PATH=$(find . -name "*.app" 2>/dev/null | head -n 1)
          fi

          echo "Aplicativo encontrado em: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERRO: Nenhum pacote .app foi localizado."
            find build || true
            find ~/Library/Developer/Xcode/Archives 2>/dev/null || true
            exit 1
          fi

          cp -R "$APP_PATH" build-output/Payload/
          cd build-output
          zip -r -y meu-app-nubank.ipa Payload
          cd ..

      - name: 📤 Disponibilizar IPA para Download no GitHub
        uses: actions/upload-artifact@v4
        with:
          name: meu-app-nubank-ipa
          path: build-output/meu-app-nubank.ipa
          retention-days: 14
